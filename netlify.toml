[build]
  command = "npx expo export -p web && node scripts/inject-web-icons.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: serve index.html for any route so deep links don't 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never cache the entry HTML or manifest, so the home-screen PWA always loads
# the newest build instead of a stale cached copy. The hashed JS/asset files
# (below) are safe to cache forever because their names change every build.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/_expo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
